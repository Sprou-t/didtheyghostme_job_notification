name: Watch internships

on:
  schedule:
    # GitHub cron uses UTC: 00:00/12:00 UTC = 08:00/20:00 Singapore time.
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: internship-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for new roles
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONFIGURED_ROLE_KEYWORDS: ${{ vars.ROLE_KEYWORDS }}
        run: |
          if [[ -n "$CONFIGURED_ROLE_KEYWORDS" ]]; then
            export ROLE_KEYWORDS="$CONFIGURED_ROLE_KEYWORDS"
          fi
          python watcher.py

      - name: Persist watcher state
        run: |
          if git diff --quiet -- state/seen_rows.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen_rows.json
          git commit -m "chore: update internship watcher state [skip ci]"
          git push
